name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows runs the real ROOT/Disallowed store code; macOS runs the system verifier against the incident chains.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --frozen --group dev pytest -q
      - name: Scan this runner
        run: uv run --frozen trustwatch scan --fail-on never --json report.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests in the test image
        run: docker compose run --rm --build test
      - name: Website behind the proxy
        run: |
          docker compose up -d --build --wait web proxy
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/status | grep -q '"mode": "public"'
      - name: Scan an image with the scanner image
        run: |
          mkdir -p reports
          docker compose run --rm --build scan --image node:22-slim --fail-on never
          test -s reports/trustwatch-report.json
      - if: always()
        run: docker compose logs --no-color
