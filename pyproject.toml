[project]
name = "trustwatch"
version = "0.3.0"
description = "Find trust stores that still trust distrusted or compromised certificate authorities, and say how to fix them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
desktop = ["pywebview>=5"]

[project.scripts]
trustwatch = "trustwatch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::cryptography.utils.CryptographyDeprecationWarning"]
